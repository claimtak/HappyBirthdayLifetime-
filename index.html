  const WA_NUMBER = "919158858885";

  const $ = (id) => document.getElementById(id);

  function toDevanagari(n) {
    return String(n).replace(/\d/g, d => "०१२३४५६७८९"[d]);
  }
  function ageText(n) {
    const t = translations[currentLang];
    const num = currentLang === "en" ? n : toDevanagari(n);
    return num + " " + t.ageSuffix;
  }
  function getChildName() {
    return $("child-name-input").value.trim();
  }

  function renderAgePills() {
    const container = $("pills-container");
    container.innerHTML = "";
    for (let age = 0; age <= 10; age++) {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "age-pill" + (age === currentAge ? " active" : "");
      pill.textContent = ageText(age);
      pill.onclick = () => selectAge(age);
      container.appendChild(pill);
    }
  }

  function selectAge(age) {
    currentAge = age;
    renderAgePills();
    updateCardData();
  }

    const t = translations[currentLang];

      : t.wishesChildDefault;
    updateWhatsAppLink();
  }

  function updateCardData() {
    const d = planData[currentAge];
    const l = currentLang;

  function updateWhatsAppLink() {
    const t = translations[currentLang];
    const msg = t.waMsg(
      currentLang === "en" ? currentAge : toDevanagari(currentAge),
      getChildName(),
      planData[currentAge].premium[currentLang]
    );
    $("btn-whatsapp").href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg);
  }

  function setLang(lang) {
    if (!translations[lang]) return;
    currentLang = lang;
    try { localStorage.setItem("lic883_lang", lang); } catch (e) {}
    updateUI();
  }

  // Card photo: html2canvas -> Web Share API (files) -> download fallback
  async function captureAndShareCard() {
    const t = translations[currentLang];
    const toast = $("loading-toast");
    toast.style.display = "block";
    try {
      if (typeof html2canvas === "undefined") throw new Error("html2canvas not loaded");
      if (document.fonts && document.fonts.ready) await document.fonts.ready;

      const canvas = await html2canvas($("capture-card"), {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true,
        logging: false
      });
      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      if (!blob) throw new Error("Blob creation failed");

      const name = getChildName();
      const safeName = (name || "child").replace(/[^\w\u0900-\u097F-]+/g, "_");
      const fileName = "LIC-Jeevan-Utsav-883_" + safeName + "_age" + currentAge + ".png";
      const file = new File([blob], fileName, { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: t.title, text: t.cardShareText });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return; // user cancelled
          // otherwise fall through to download
        }
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (err) {
      console.error(err);
      alert(t.shareErr);
    } finally {
      toast.style.display = "none";
    }
  }

  // Share app link
  async function shareAppLink() {
    const t = translations[currentLang];
    const url = window.location.href.split("#")[0];
    if (navigator.share) {
      try {
        await navigator.share({ title: t.title, text: t.shareText, url: url });
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }
    // Fallback: WhatsApp share
    window.open("https://wa.me/?text=" + encodeURIComponent(t.shareText + "\n" + url), "_blank", "noopener");
  }

  // Init
  (function init() {
    try {
      const saved = localStorage.getItem("lic883_lang");
      if (saved && translations[saved]) currentLang = saved;
    } catch (e) {}
    updateUI();
  })();
