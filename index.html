  const WA_NUMBER = "919158858885";
  let currentLang = "mr";
  let currentAge = 0;

  const $ = (id) => document.getElementById(id);

  function toDevanagari(n) {
    return String(n).replace(/\d/g, d => "०१२३४५६७८९"[d]);
  }
  function ageText(n) {
    const t = translations[currentLang];
    const num = currentLang === "en" ? n : toDevanagari(n);
    return num + " " + t.ageSuffix;
  }
  function getChildName() {
    return $("child-name-input").value.trim();
  }

  // Age pills
  function renderAgePills() {
    const container = $("pills-container");
    container.innerHTML = "";
    for (let age = 0; age <= 10; age++) {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "age-pill" + (age === currentAge ? " active" : "");
      pill.textContent = ageText(age);
      pill.onclick = () => selectAge(age);
      container.appendChild(pill);
    }
  }

  function selectAge(age) {
    currentAge = age;
    renderAgePills();
    updateCardData();
  }

  function updateCardName() {
    const t = translations[currentLang];
    const name = getChildName();
    $("card-wishes-child").textContent = name
      ? t.wishesFor + name + t.wishesSuffix
      : t.wishesChildDefault;
    $("poster-name").textContent = name ? t.posterNameFor + name : t.posterNameDefault;
    updateWhatsAppLink();
  }

  // Static text per language
  function updateUI() {
    const t = translations[currentLang];
    document.documentElement.lang = t.htmlLang;
    document.title = t.pageTitle;

    document.querySelectorAll(".lang-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.lang === currentLang));

    $("txt-badge").textContent = t.badge;
    $("txt-title").textContent = t.title;
    $("txt-subtitle").textContent = t.subtitle;
    $("txt-select-age").textContent = t.selectAge;
    $("child-name-input").placeholder = t.childPlaceholder;
    $("card-wishes-heading").textContent = t.wishesHeading;
    $("txt-sovereign").textContent = t.sovereign;
    $("lbl-prem").textContent = t.lblPrem;
    $("lbl-yearly").textContent = t.lblYearly;
    $("lbl-cover").textContent = t.lblCover;
    $("lbl-mat").textContent = t.lblMat;
    $("lbl-total").textContent = t.lblTotal;
    $("feat-1").textContent = t.feat1;
    $("feat-2").textContent = t.feat2;
    $("feat-3").textContent = t.feat3;
    $("card-disclaimer").textContent = t.disclaimer;
    $("footer-disclaimer").textContent = t.disclaimer;
    $("txt-brand-exp").textContent = t.brandExp;
    $("txt-footer-adv").textContent = t.adviser;
    $("txt-btn-wa").textContent = t.btnWa;
    $("txt-btn-wa-sub").textContent = t.btnWaSub;
    $("txt-btn-photo").textContent = t.btnPhoto;
    $("txt-btn-photo-sub").textContent = t.btnPhotoSub;
    $("txt-btn-share").textContent = t.btnShare;
    $("loading-toast").textContent = t.loading;

    $("poster-banner").textContent = t.posterBanner;
    $("poster-lbl-gift").textContent = t.posterGift;
    $("poster-lbl-prem").textContent = t.posterPrem;
    $("poster-lbl-cover").textContent = t.posterCover;
    $("poster-lbl-mat").textContent = t.posterMat;
    $("poster-trust").textContent = t.posterTrust;
    $("poster-disc").textContent = t.posterDisc;
    $("poster-guidance").textContent = t.posterGuidance;
    $("poster-firm").innerHTML = t.posterFirm;
    $("txt-btn-poster").textContent = t.btnPoster;
    $("txt-btn-poster-sub").textContent = t.btnPosterSub;

    renderAgePills();
    updateCardData();
    fitPoster();
  }

  // Numbers per selected age
  function updateCardData() {
    const d = planData[currentAge];
    const l = currentLang;
    $("val-prem").textContent = d.premium[l];
    $("val-yearly").textContent = d.payout[l];
    $("val-cover").textContent = d.cover[l];
    $("val-mat").textContent = d.maturity[l];
    $("val-total").textContent = d.total[l];
    $("poster-val-gift").textContent = d.payout[l] + " " + translations[l].perYear;
    $("poster-val-prem").textContent = d.premium[l];
    $("poster-val-cover").textContent = d.cover[l];
    $("poster-val-mat").textContent = d.maturity[l];
    updateCardName();
  }

  function updateWhatsAppLink() {
    const t = translations[currentLang];
    const msg = t.waMsg(
      currentLang === "en" ? currentAge : toDevanagari(currentAge),
      getChildName(),
      planData[currentAge].premium[currentLang]
    );
    $("btn-whatsapp").href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg);
  }

  function setLang(lang) {
    if (!translations[lang]) return;
    currentLang = lang;
    try { localStorage.setItem("lic883_lang", lang); } catch (e) {}
    updateUI();
  }

  // Card photo: html2canvas -> Web Share API (files) -> download fallback
  async function captureAndShareCard(opts) {
    opts = opts || {};
    const t = translations[currentLang];
    const toast = $("loading-toast");
    toast.style.display = "block";
    try {
      if (typeof html2canvas === "undefined") throw new Error("html2canvas not loaded");
      if (document.fonts && document.fonts.ready) await document.fonts.ready;

      const canvas = await html2canvas($(opts.id || "capture-card"), {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true,
        logging: false,
        onclone: opts.onclone
      });
      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      if (!blob) throw new Error("Blob creation failed");

      const name = getChildName();
      const safeName = (name || "child").replace(/[^\w\u0900-\u097F-]+/g, "_");
      const fileName = opts.fileName ? opts.fileName() : "LIC-Jeevan-Utsav-883_" + safeName + "_age" + currentAge + ".png";
      const file = new File([blob], fileName, { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: t.title, text: t.cardShareText });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return; // user cancelled
          // otherwise fall through to download
        }
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (err) {
      console.error(err);
      alert(t.shareErr + "\n(" + (err && err.message ? err.message : err) + ")");
    } finally {
      toast.style.display = "none";
    }
  }

  // Square poster: scaled to fit on screen, exported at its true 600x600 size (x2 = 1200x1200 PNG)
  function fitPoster() {
    const wrap = $("poster-wrap");
    const poster = $("bday-poster-card");
    if (!wrap || !poster) return;
    const s = wrap.clientWidth / 600;
    poster.style.transform = "scale(" + s + ")";
    wrap.style.height = (600 * s) + "px";
  }
  window.addEventListener("resize", fitPoster);

  function captureAndSharePoster() {
    return captureAndShareCard({
      id: "bday-poster-card",
      fileName: () => "Birthday-Wishes-Age-" + currentAge + ".png",
      onclone: (doc) => {
        const p = doc.getElementById("bday-poster-card");
        p.style.transform = "none";
        p.style.position = "relative";
        const w = doc.getElementById("poster-wrap");
        w.style.width = "600px";
        w.style.height = "600px";
        w.style.borderRadius = "0";
        w.style.boxShadow = "none";
      }
    });
  }

  // Share app link
  async function shareAppLink() {
    const t = translations[currentLang];
    const url = window.location.href.split("#")[0];
    if (navigator.share) {
      try {
        await navigator.share({ title: t.title, text: t.shareText, url: url });
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }
    // Fallback: WhatsApp share
    window.open("https://wa.me/?text=" + encodeURIComponent(t.shareText + "\n" + url), "_blank", "noopener");
  }

  // Init
  (function init() {
    try {
      const saved = localStorage.getItem("lic883_lang");
      if (saved && translations[saved]) currentLang = saved;
    } catch (e) {}
    updateUI();
  })();
</script>
